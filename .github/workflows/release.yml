name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Run code validation
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Package Release APK
        run: |
          mkdir -p release-artifacts
          find android/app/build/outputs/apk -type f -name "*.apk" -exec cp {} release-artifacts/receipt-policy-scanner-${{ github.ref_name }}.apk \;

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v3
        with:
          files: release-artifacts/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
